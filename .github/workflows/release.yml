name: Build and publish RedPlay

on:
  push:
    branches:
      - Software-Engineering
    paths:
      - 'RedPlayIPTV-Source*.zip'
      - 'VERSION'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find and unpack source package
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" \
            | grep -E '^RedPlayIPTV-Source.*\.zip$' \
            | head -n 1 || true)"

          if [[ -z "$SOURCE" && -f ./RedPlayIPTV-Source.zip ]]; then
            SOURCE=./RedPlayIPTV-Source.zip
          fi

          if [[ -z "$SOURCE" ]]; then
            SOURCE="$(for f in RedPlayIPTV-Source*.zip; do
              [[ -f "$f" ]] || continue
              printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
            done | sort -nr | head -n 1 | cut -f2-)"
          fi

          if [[ -z "$SOURCE" || ! -f "$SOURCE" ]]; then
            echo "No RedPlay source ZIP is present." >&2
            exit 1
          fi

          echo "Using source package: $SOURCE"
          rm -rf build
          mkdir build
          unzip -q "$SOURCE" -d build

      - name: Test source
        if: steps.existing.outputs.exists != 'true'
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Build and Windows-validate x64 app and installer
        if: steps.existing.outputs.exists != 'true'
        working-directory: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist cmd/setup/payload

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "dist/RedPlayIPTV-$VERSION.exe" .
          cp "dist/RedPlayIPTV-$VERSION.exe" cmd/setup/payload/RedPlayIPTV.exe
          cp assets/RedPlayIcon.ico cmd/setup/payload/RedPlayIcon.ico

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "dist/RedPlayIPTV-Setup-$VERSION.exe" ./cmd/setup

          (cd dist && sha256sum "RedPlayIPTV-$VERSION.exe" "RedPlayIPTV-Setup-$VERSION.exe" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "build/dist/RedPlayIPTV-$VERSION.exe" \
            "build/dist/RedPlayIPTV-Setup-$VERSION.exe" \
            "build/dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "RedPlay IPTV $VERSION" \
            --notes-file RELEASE_NOTES.md
