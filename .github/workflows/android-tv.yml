name: Android TV

on:
  push:
    branches: [android-tv]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests and debug APK
        working-directory: android-tv
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RedPlayIPTV-AndroidTV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
